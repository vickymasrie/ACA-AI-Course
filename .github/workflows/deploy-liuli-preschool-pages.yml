name: Deploy Li u Li Preschool site to GitHub Pages

on:
  push:
    branches: [claude/armenian-preschool-website-4rtfn3]
    paths:
      - 'projects/liuli-preschool-website/**'
      - '.github/workflows/deploy-liuli-preschool-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/liuli-preschool-website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
